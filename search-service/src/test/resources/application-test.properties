spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=search-service-test
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.elasticsearch.uris=http://localhost:9200

app.jwt.secret=test-secret-key-test-secret-key-test-secret-key
app.search.index-name=listings
app.search.default-page-size=20
app.search.max-page-size=100

app.integration.listing-service.base-url=http://localhost:8082
app.reindex.page-size=100

app.search.index-initializer.enabled=false

management.endpoints.web.exposure.include=health,info