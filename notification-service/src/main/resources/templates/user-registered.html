<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Activate your account</title>
</head>
<body>
<p>Hello <span th:text="${email}">user@example.com</span>,</p>

<p>Thanks for signing up for EstateHub. Please activate your account by clicking the link below:</p>

<p>
    <a th:href="${activationLink}" th:text="${activationLink}">activation-link</a>
</p>

<p>If you didn’t create an account, you can safely ignore this email.</p>
</body>
</html>
