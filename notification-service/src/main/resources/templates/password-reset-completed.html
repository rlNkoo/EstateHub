<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Password changed</title>
</head>
<body>
<p>Hello <span th:text="${email}">user@example.com</span>,</p>

<p>Your EstateHub password has been changed.</p>

<p th:if="${completedAt != null}">
    Changed at: <span th:text="${completedAt}">2026-01-01T00:00:00Z</span>
</p>

<p>If you didn’t do this, please contact support immediately.</p>
</body>
</html>
