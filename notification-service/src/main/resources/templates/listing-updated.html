<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>Listing updated</title>
</head>

<body style="margin:0; padding:0; background:#f4f6fb;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
       style="background:#f4f6fb; margin:0; padding:0;">
    <tr>
        <td align="center" style="padding: 28px 12px;">
            <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"
                   style="width:600px; max-width:600px;">
                <tr>
                    <td style="font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; color:#111827; padding: 0 12px 14px 12px;">
                        EstateHub
                    </td>
                </tr>

                <tr>
                    <td style="padding: 0 12px;">
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                               style="background:#ffffff; border-radius:14px; overflow:hidden; box-shadow: 0 10px 30px rgba(17,24,39,0.08);">
                            <tr>
                                <td style="padding: 26px 24px; font-family: Arial, sans-serif;">
                                    <p style="margin:0; font-size: 14px; line-height: 1.6; color:#111827;">
                                        Hello <span th:text="${email}" style="font-weight:700;">user@example.com</span>,
                                    </p>

                                    <p style="margin:12px 0 0 0; font-size: 14px; line-height: 1.7; color:#374151;">
                                        Your listing has been updated.
                                    </p>

                                    <p style="margin:16px 0 0 0; font-size: 14px; line-height: 1.7; color:#374151;">
                                        Listing: <strong th:text="${title}">Title</strong><br/>
                                        Listing ID: <span th:text="${listingId}">id</span><br/>
                                        Version: <span th:text="${version}">1</span>
                                    </p>

                                    <p style="margin:16px 0 0 0; font-size: 14px; line-height: 1.7; color:#374151;">
                                        View your listing:
                                        <a th:href="${listingLink}" th:text="${listingLink}"
                                           style="color:#2563eb; text-decoration: underline; word-break: break-all;">
                                            listing-link
                                        </a>
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="height: 18px; line-height:18px; font-size:0;">&nbsp;</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
