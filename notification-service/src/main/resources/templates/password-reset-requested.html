<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Password reset</title>
</head>
<body>
<p>Hello <span th:text="${email}">user@example.com</span>,</p>

<p>We received a request to reset your password. You can set a new password using the link below:</p>

<p>
    <a th:href="${resetLink}" th:text="${resetLink}">reset-link</a>
</p>

<p>If you didn’t request a password reset, you can safely ignore this email.</p>
</body>
</html>
