spring.application.name=notification-service

server.port=8085

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/estatehub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:estatehub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:estatehub}
spring.jpa.hibernate.ddl-auto=update

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

notification.mail.from=${NOTIFICATION_MAIL_FROM:no-reply@estatehub}
notification.app.base-url=${NOTIFICATION_APP_BASE_URL:http://localhost:8085}