spring.application.name=notification-service

server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/estatehub
spring.datasource.username=estatehub
spring.datasource.password=estatehub
spring.jpa.hibernate.ddl-auto=update

spring.kafka.bootstrap-servers=localhost:9092

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

notification.mail.from=no-reply@estatehub
notification.app.base-url=http://localhost:8080