spring.application.name=media-service

server.port=8083

s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
s3.access-key=${S3_ACCESS_KEY:minioadmin}
s3.secret-key=${S3_SECRET_KEY:minioadmin}
s3.bucket=${S3_BUCKET:estatehub-media}
s3.region=${S3_REGION:us-east-1}

app.media.max-photos-per-listing=15
app.media.max-file-size-bytes=10485760
app.media.allowed-content-types=image/jpeg,image/png,image/webp
app.media.presigned-get-url-ttl=5m

app.jwt.secret=${APP_JWT_SECRET:Z8rN4yXJvP6KQe3H9sWc2F5M7BfTqLkRjA6mU0aE1dSxYJpPzCwVnH}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/estatehub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:estatehub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:estatehub}
spring.jpa.hibernate.ddl-auto=update

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

app.services.listing=${APP_SERVICES_LISTING:http://localhost:8082}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

logging.level.root=INFO
logging.level.com.rlnkoo.mediaservice=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.apache.kafka.clients=WARN
logging.level.org.apache.kafka.common=WARN
logging.level.org.springframework.web.multipart=INFO