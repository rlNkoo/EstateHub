spring.datasource.url=jdbc:h2:mem:mediaservice;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

s3.endpoint=http://localhost:9000
s3.access-key=test
s3.secret-key=test
s3.bucket=estatehub-media-test
s3.region=us-east-1

app.media.max-photos-per-listing=15
app.media.max-file-size-bytes=5242880
app.media.allowed-content-types=image/jpeg,image/png,image/webp
app.media.presigned-get-url-ttl=5m

app.jwt.secret=test-secret-test-secret-test-secret

spring.kafka.bootstrap-servers=localhost:9092

app.services.listing=http://localhost:8082

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB